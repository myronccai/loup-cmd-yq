# A Python project file, as tomlq meets them: tables, dotted keys, arrays
# of strings and an array of tables.
[project]
name = "shop-client"
version = "1.8.0"
description = "Client for the shop API"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6,<3",
    "rich",
]
authors = [{ name = "Ada Lovelace", email = "ada@example.com" }]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy"]

[project.scripts]
shop = "shop_client.cli:main"

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I"]

[[tool.mypy.overrides]]
module = "rich.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
follow_imports = "skip"
